<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - AI Writing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="config.js"></script>

<link rel="stylesheet" href="css/style.css">

<script>
// 🔒 LOGIN PROTECTION
if (!localStorage.getItem("user")) {
    window.location.href = "login.html";
}
</script>

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    background: linear-gradient(270deg,#6a11cb,#ff4b2b);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove {
    0% {background-position: 0%;}
    50% {background-position: 100%;}
    100% {background-position: 0%;}
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
}

.nav-btn {
    margin-left: 10px;
    padding: 8px 18px;
    border-radius: 20px;
    border: none;
    background: #ffd700;
    cursor: pointer;
    transition: 0.3s;
}

.nav-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 15px #ffd700;
}

/* MAIN */
.container {
    width: 90%;
    margin: auto;
    margin-top: 30px;
    animation: fadeUp 0.8s ease;
}

/* STATS */
.stats {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
}

.stat-box {
    background: rgba(0,0,0,0.6);
    padding: 20px;
    border-radius: 12px;
    width: 180px;
    text-align: center;
    margin: 10px;
}

/* CHART GRID */
.chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

/* CARD */
.card {
    background: rgba(0,0,0,0.6);
    padding: 20px;
    border-radius: 15px;
}

/* TABLE */
table {
    width: 100%;
    margin-top: 15px;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

/* ANIMATION */
@keyframes fadeUp {
    from {opacity: 0; transform: translateY(30px);}
    to {opacity: 1; transform: translateY(0);}
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div><b>📊 Dashboard</b></div>

    <div>
        <button class="nav-btn" onclick="goTo('app.html')">Home</button>
        <button class="nav-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">

<!-- STATS -->
<div class="stats">
    <div class="stat-box">
        <h3 id="avg">--</h3>
        <p>Average</p>
    </div>
    <div class="stat-box">
        <h3 id="total">--</h3>
        <p>Total</p>
    </div>
    <div class="stat-box">
        <h3 id="max">--</h3>
        <p>Best</p>
    </div>
    <div class="stat-box">
        <h3 id="min">--</h3>
        <p>Lowest</p>
    </div>
</div>

<!-- GRAPHS -->
<div class="chart-grid">

    <div class="card">
        <canvas id="lineChart"></canvas>
    </div>

    <div class="card">
        <canvas id="barChart"></canvas>
    </div>

    <div class="card">
        <canvas id="pieChart"></canvas>
    </div>

    <div class="card">
        <canvas id="radarChart"></canvas>
    </div>

</div>

<!-- RECENT -->
<div class="card">
    <h3>📋 Recent Activity</h3>
    <table>
        <thead>
            <tr>
                <th>Text</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody id="tableData"></tbody>
    </table>
</div>

<!-- AI SUGGESTIONS -->
<div class="card">
    <h3>🤖 AI Suggestions</h3>
    <ul id="suggestions"></ul>
</div>

</div>

<script>

const API = window.API_BASE_URL;

// NAVIGATION
function goTo(page) {
    window.location.href = page;
}

function logout() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

// LOAD DATA
fetch(API + "/get-dashboard-data")
.then(res => res.json())
.then(data => {

    document.getElementById("avg").innerText = data.avg_score.toFixed(1);
    document.getElementById("total").innerText = data.total;
    document.getElementById("max").innerText = data.max_score;
    document.getElementById("min").innerText = data.min_score;

    let scores = data.scores;

    // LINE
    new Chart(document.getElementById("lineChart"), {
        type: 'line',
        data: {
            labels: scores.map((_, i) => i+1),
            datasets: [{ data: scores }]
        }
    });

    // BAR
    new Chart(document.getElementById("barChart"), {
        type: 'bar',
        data: {
            labels: ["Min","Avg","Max"],
            datasets: [{
                data: [data.min_score, data.avg_score, data.max_score]
            }]
        }
    });

    // PIE
    new Chart(document.getElementById("pieChart"), {
        type: 'pie',
        data: {
            labels: ["Low","Mid","High"],
            datasets: [{
                data: [
                    scores.filter(s=>s<50).length,
                    scores.filter(s=>s<80 && s>=50).length,
                    scores.filter(s=>s>=80).length
                ]
            }]
        }
    });

    // RADAR
    new Chart(document.getElementById("radarChart"), {
        type: 'radar',
        data: {
            labels: ["Grammar","Clarity","Structure","Vocabulary"],
            datasets: [{
                data: [
                    data.avg_score,
                    data.avg_score-5,
                    data.avg_score-10,
                    data.avg_score-3
                ]
            }]
        }
    });

    // TABLE
    let table = document.getElementById("tableData");
    data.recent.forEach(r => {
        table.innerHTML += `<tr><td>${r.text}</td><td>${r.score}</td></tr>`;
    });

    // SUGGESTIONS
    let ul = document.getElementById("suggestions");
    data.suggestions.forEach(s => {
        ul.innerHTML += `<li>${s}</li>`;
    });

});

</script>

</body>
</html>

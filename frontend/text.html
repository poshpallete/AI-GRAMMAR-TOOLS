<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text Analysis - AI Writing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">
<script src="config.js"></script>

<script>
if (!localStorage.getItem("user")) {
    window.location.href = "login.html";
}
</script>

<style>
body { margin: 0; font-family: 'Segoe UI'; color: white; }
.navbar { display: flex; justify-content: space-between; padding: 20px 40px; }
.nav-btn { margin-left: 10px; padding: 8px 18px; border-radius: 20px; border: none; background: #ffd700; cursor: pointer; }
.container { width: 90%; max-width: 800px; margin: auto; margin-top: 40px; }
textarea { width: 100%; height: 150px; border-radius: 10px; padding: 12px; border: none; background: rgba(255,255,255,0.1); color: white; }
.btn { margin-top: 15px; padding: 12px 25px; border-radius: 25px; border: none; background: #ffd700; cursor: pointer; }
.output { margin-top: 25px; padding: 20px; border-radius: 10px; background: rgba(0,0,0,0.5); min-height: 60px; }
</style>
</head>

<body>

<div class="navbar">
    <div><b>Text Analysis</b></div>
    <div>
        <button class="nav-btn" onclick="goTo('app.html')">Home</button>
        <button class="nav-btn" onclick="goTo('dashboard.html')">Dashboard</button>
        <button class="nav-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">

    <h2>Analyze Your Writing</h2>

    <textarea id="textInput" placeholder="Enter your text here..."></textarea>

    <button type="button" class="btn" onclick="analyzeText()">Analyze</button>

    <div id="output" class="output">
        Results will appear here...
    </div>

</div>

<script>

var API = window.API_BASE_URL;

function goTo(page) {
    window.location.href = page;
}

function logout() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

function analyzeText() {

    var text = document.getElementById("textInput").value;
    var output = document.getElementById("output");

    if (!text.trim()) {
        output.innerHTML = "Please enter text first";
        return;
    }

    output.innerHTML = "Analyzing with AI... Please wait...";

    fetch(API + "/analyze-text", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {

        var errorsHtml = "";
        if (data.errors && data.errors.length > 0) {
            errorsHtml = "<ul>";
            for (var i = 0; i < data.errors.length; i++) {
                errorsHtml += "<li>" + data.errors[i] + "</li>";
            }
            errorsHtml += "</ul>";
        }

        var suggestionsHtml = "";
        if (data.suggestions && data.suggestions.length > 0) {
            suggestionsHtml = "<ul>";
            for (var j = 0; j < data.suggestions.length; j++) {
                suggestionsHtml += "<li>" + data.suggestions[j] + "</li>";
            }
            suggestionsHtml += "</ul>";
        }

        var html = "";
        html += "<h3>Highlighted Errors</h3>";
        html += "<div>" + (data.highlighted || "No errors found") + "</div>";
        html += errorsHtml;
        html += "<h3>Corrected Text</h3>";
        html += "<div>" + (data.corrected || "No correction needed") + "</div>";
        html += "<hr>";
        html += "<p><b>Score:</b> " + (data.score || 0) + " / 100</p>";
        html += "<h3>Good Version</h3>";
        html += "<div>" + (data.good_sentence || "N/A") + "</div>";
        html += "<h3>Better Version</h3>";
        html += "<div>" + (data.better_sentence || "N/A") + "</div>";
        html += "<h3>Best Version</h3>";
        html += "<div>" + (data.best_sentence || "N/A") + "</div>";
        html += "<h3>AI Suggestions for Improvement</h3>";
        html += suggestionsHtml || "<p>No suggestions</p>";

        output.innerHTML = html;
    })
    .catch(function(err) {
        console.error("Error:", err);
        output.innerHTML = "Error: Make sure backend is running (python app.py)";
    });
}

</script>

</body>
</html>

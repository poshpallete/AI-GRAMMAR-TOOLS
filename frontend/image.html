<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Analysis - AI Writing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">
<script src="config.js"></script>

<script>
if (!localStorage.getItem("user")) {
    window.location.href = "login.html";
}
</script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    background: linear-gradient(270deg,#6a11cb,#ff4b2b);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}
@keyframes gradientMove {
    0% {background-position: 0%;}
    50% {background-position: 100%;}
    100% {background-position: 0%;}
}
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
}
.nav-btn {
    margin-left: 10px;
    padding: 8px 18px;
    border-radius: 20px;
    border: none;
    background: #ffd700;
    cursor: pointer;
}
.container {
    width: 90%;
    max-width: 700px;
    margin: auto;
    margin-top: 50px;
    text-align: center;
}
.card {
    background: rgba(0,0,0,0.6);
    padding: 30px;
    border-radius: 15px;
}
input {
    margin-top: 20px;
    padding: 10px;
    border-radius: 10px;
}
.btn {
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background: #ffd700;
    cursor: pointer;
}
.output {
    margin-top: 30px;
    padding: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    text-align: left;
}
</style>
</head>

<body>

<div class="navbar">
    <div><b>Image Analysis</b></div>
    <div>
        <button class="nav-btn" onclick="goTo('app.html')">Home</button>
        <button class="nav-btn" onclick="goTo('dashboard.html')">Dashboard</button>
        <button class="nav-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div class="card">

        <h2>Upload Handwritten Image</h2>

        <input type="file" id="imageInput" accept="image/*">

        <br>

        <button type="button" class="btn" onclick="uploadImage()">Analyze Image</button>

        <div id="output" class="output">
            Results will appear here...
        </div>

    </div>
</div>

<script>

var API = window.API_BASE_URL;

function goTo(page) {
    window.location.href = page;
}

function logout() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

function uploadImage() {

    var fileInput = document.getElementById("imageInput");
    var output = document.getElementById("output");

    if (!fileInput.files.length) {
        output.innerHTML = "Please select an image first";
        return;
    }

    var formData = new FormData();
    formData.append("image", fileInput.files[0]);

    output.innerHTML = "Processing image with AI... Please wait...";

    fetch(API + "/analyze-image", {
        method: "POST",
        body: formData
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {

        if (data.error) {
            output.innerHTML = "<p>Error: " + data.error + "</p>";
            return;
        }

        var errorsHtml = "";
        if (data.errors && data.errors.length > 0) {
            errorsHtml = "<ul>";
            for (var i = 0; i < data.errors.length; i++) {
                errorsHtml += "<li>" + data.errors[i] + "</li>";
            }
            errorsHtml += "</ul>";
        }

        var suggestionsHtml = "";
        if (data.suggestions && data.suggestions.length > 0) {
            suggestionsHtml = "<ul>";
            for (var j = 0; j < data.suggestions.length; j++) {
                suggestionsHtml += "<li>" + data.suggestions[j] + "</li>";
            }
            suggestionsHtml += "</ul>";
        }

        var html = "";
        html += "<h3>Extracted Text (OCR)</h3>";
        html += "<p>" + (data.extracted || "No text found") + "</p>";
        html += "<h3>Highlighted Errors</h3>";
        html += "<p>" + (data.highlighted || "No errors") + "</p>";
        html += errorsHtml;
        html += "<h3>Corrected Text</h3>";
        html += "<p>" + (data.corrected || "") + "</p>";
        html += "<h3>Good Version</h3>";
        html += "<p>" + (data.good_sentence || "N/A") + "</p>";
        html += "<h3>Better Version</h3>";
        html += "<p>" + (data.better_sentence || "N/A") + "</p>";
        html += "<h3>Best Version</h3>";
        html += "<p>" + (data.best_sentence || "N/A") + "</p>";
        html += "<h3>AI Suggestions</h3>";
        html += suggestionsHtml || "<p>No suggestions</p>";

        output.innerHTML = html;
    })
    .catch(function(err) {
        console.error("Error:", err);
        output.innerHTML = "Error: Make sure backend is running (python app.py) and Tesseract OCR is installed";
    });
}

</script>

</body>
</html>

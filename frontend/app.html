<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Writing App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>

/* ===== LOGIN PROTECTION ===== */
</style>

<script>
// 🔒 PROTECT PAGE
if (!localStorage.getItem("user")) {
    window.location.href = "login.html";
}
</script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    background: linear-gradient(270deg,#6a11cb,#ff4b2b);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

/* Gradient Animation */
@keyframes gradientMove {
    0% {background-position: 0%;}
    50% {background-position: 100%;}
    100% {background-position: 0%;}
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
}

.nav-btn {
    margin-left: 10px;
    padding: 8px 18px;
    border-radius: 20px;
    border: none;
    background: #ffd700;
    cursor: pointer;
    transition: 0.3s;
}

.nav-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 15px #ffd700;
}

/* TITLE */
.title {
    text-align: center;
    margin-top: 40px;
    animation: fadeDown 1s ease;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    padding: 50px;
}

/* CARDS */
.card {
    background: rgba(0,0,0,0.6);
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
    animation: fadeUp 1s ease;
}

.card:hover {
    transform: translateY(-12px);
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
}

/* ANIMATIONS */
@keyframes fadeUp {
    from {opacity: 0; transform: translateY(40px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes fadeDown {
    from {opacity: 0; transform: translateY(-40px);}
    to {opacity: 1; transform: translateY(0);}
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div><b>🧠 AI Writing System</b></div>

    <div>
        <button class="nav-btn" onclick="goTo('dashboard.html')">Dashboard</button>
        <button class="nav-btn" onclick="logout()">Logout</button>
    </div>
</div>

<!-- TITLE -->
<div class="title">
    <h1>Welcome to AI Writing Platform</h1>
    <p>Select a feature to continue</p>
</div>

<!-- FEATURE GRID -->
<div class="grid">

    <div class="card" onclick="goTo('text.html')">
        <h3>📝 Text Analysis</h3>
        <p>Check grammar and improve writing</p>
    </div>

    <div class="card" onclick="goTo('image.html')">
        <h3>🖼 Image Analysis</h3>
        <p>Convert handwriting to text</p>
    </div>

    <div class="card" onclick="goTo('live.html')">
        <h3>📹 Live Writing</h3>
        <p>Detect handwriting using camera</p>
    </div>

    <div class="card" onclick="goTo('features.html')">
        <h3>🔥 Smart AI Tools</h3>
        <p>Notes, simplify, expand & more</p>
    </div>

</div>

<!-- SCRIPT -->
<script>

function goTo(page) {
    window.location.href = page;
}

function logout() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

</script>

</body>
</html>
